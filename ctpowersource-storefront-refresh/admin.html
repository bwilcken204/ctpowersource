<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="./ct-favicon.png"><link rel="apple-touch-icon" href="./ct-favicon.png"><meta name="robots" content="noindex,nofollow"><title>CTE Administration</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./admin.css"><script src="./admin.js" defer></script></head>
<body><header class="admin-header"><a href="./index.html">CT Power Source</a><span>CTE Administration</span><button id="logout" hidden>Sign out</button></header><main class="shell"><h1>Orders & customers</h1><section id="signin"><p>Sign in with sales@ctelectricreps.com using an email verification code.</p><form id="send-code"><button>Send sign-in code</button></form><form id="verify-code" hidden><label>Email verification code <input name="code" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}"></label><button>Sign in</button></form></section><p id="status" role="status"></p><section id="dashboard" hidden><nav class="admin-tabs"><button data-tab="orders">Orders</button><button data-tab="customers">Customers</button><button id="refresh">Refresh</button></nav><p>Orders are requests for CTE review. Invoice and tracking numbers are recorded manually.</p><nav id="order-stages" class="admin-tabs" aria-label="Order stages"><button data-stage="pending_approval">Pending orders</button><button data-stage="approved">Accepted / Preparing shipment</button><button data-stage="closed_invoiced">Closed &amp; invoiced</button><button data-stage="declined">Declined</button><button data-stage="all">All orders</button></nav><h2 id="view-title"></h2><div id="records"></div><nav class="admin-pages"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></nav></section></main></body></html>
